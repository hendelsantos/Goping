name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e análise estática
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verificar formatação
        run: test -z "$(gofmt -l .)"

      - name: Executar testes
        run: go test -race ./...

      - name: Executar análise estática
        run: go vet ./...